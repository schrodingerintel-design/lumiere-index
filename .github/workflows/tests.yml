name: Tests

# The repo previously had no CI — Vercel deployment was the only automated
# check, so test runs only happened locally. This runs the full suite on
# every PR and every push to master. The suite is hermetic: in-memory
# SQLite, no live TMDB/YouTube/MySQL access, no secrets required.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q

  frontend-tests:
    name: Frontend tests (vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumiere-the-index-codebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lumiere-the-index-codebase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Run vitest
        run: npm run test
